{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "soulside.fullname" . }}
# Compose put every service on one flat network. Here the datastores only
# accept traffic from the API pods (needs a CNI that enforces NetworkPolicy:
# kind's kindnet and the EKS VPC CNI with network policy enabled both do).
{{- range $component, $port := dict "mongo" 27017 "redis" 6379 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "soulside.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  podSelector:
    matchLabels:
      {{- include "soulside.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "soulside.selectorLabels" (dict "ctx" $ "component" "api") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $port }}
{{- end }}
{{- end }}
