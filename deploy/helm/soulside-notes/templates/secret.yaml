{{- /*
Kubernetes replacement for the Compose `secrets: mongo_root_password` file.

Mounted into the mongo and api pods as the file
/etc/soulside/secrets/mongo_root_password. Both read it through an env var
(MONGO_INITDB_ROOT_PASSWORD_FILE and MONGO_PASSWORD_FILE, as in Compose), so
server/db.ts works unchanged.
*/ -}}
{{- if not .Values.mongo.auth.existingSecret }}
{{- $name := include "soulside.mongoSecretName" . }}
{{- $password := .Values.mongo.auth.rootPassword }}
{{- if not $password }}
  {{- /* Reuse the password already in the cluster so upgrades never rotate it. */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- if and $existing $existing.data (index $existing.data "mongo-root-password") }}
    {{- $password = index $existing.data "mongo-root-password" | b64dec }}
  {{- else }}
    {{- $password = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "soulside.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo
  annotations:
    # Keep the Secret on `helm uninstall`: the mongo volume outlives the release
    # and still expects this password.
    helm.sh/resource-policy: keep
type: Opaque
data:
  mongo-root-password: {{ $password | b64enc | quote }}
{{- end }}
